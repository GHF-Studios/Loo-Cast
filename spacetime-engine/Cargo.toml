[package]
name = "spacetime-engine"
version.workspace = true
edition.workspace = true

[dependencies]
spacetime-engine-macros = { path = "../spacetime-engine-macros" }
bevy = {
    version = "0.19.1",
    default-features = false,
    features = [
        "default_app",
        "default_platform",
        "3d_bevy_render",
        "ui_bevy_render",
        "debug",
        "file_watcher",
    ],
}
avian3d = "0.7.0"
bevy_egui = { version = "0.42.0", default-features = false, features = ["default_fonts", "render"] }
egui_dock = "0.21.1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
inventory = { workspace = true }
