[package]
name = "spacetime-engine"
version.workspace = true
edition.workspace = true

[features]
default = []
profiling-tracy = ["bevy/trace_tracy", "dep:tracy-client"]
profiling-tracy-memory = ["profiling-tracy", "bevy/trace_tracy_memory"]
profiling-chrome = ["bevy/trace_chrome"]
profiling-detailed = ["bevy/detailed_trace"]

[dependencies]
spacetime-engine-macros = { path = "../spacetime-engine-macros" }
glam.workspace = true
bevy = {
    version = "0.19.1",
    default-features = false,
    features = [
        "default_app",
        "default_platform",
        "3d_bevy_render",
        "ui_bevy_render",
        "debug",
        "file_watcher",
    ],
}
avian3d = { version = "0.7.0", features = ["simd"] }
fast-surface-nets = "0.2.1"
# Keep the editor stack on one egui generation. bevy-inspector-egui 0.37 is
# Bevy 0.19's inspector release and uses bevy_egui 0.40 / egui 0.34.
bevy_egui = { version = "0.40.0", default-features = false, features = ["default_fonts", "render"] }
bevy-inspector-egui = { version = "0.37.0", default-features = false, features = ["bevy"] }
egui_dock = "0.19.1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inventory = { workspace = true }
# Bevy 0.19 resolves tracy-client 0.18.x; this additive feature edge turns
# Tracy's existing instrumentation into TRACY_ON_DEMAND without replacing
# Bevy's tracing subscriber/integration.
tracy-client = { version = "0.18", default-features = false, features = ["ondemand"], optional = true }
vapor_telemetry = { git = "https://github.com/GHF-Studios/Vapor", package = "vapor_telemetry" }
