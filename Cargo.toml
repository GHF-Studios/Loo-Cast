[workspace]
resolver = "3"
members = ["spacetime-engine", "loo-cast-game", "loo-cast-packagepack"]

[workspace.package]
version = "0.5.0"
edition = "2024"

[profile.dev]
# Line tables retain actionable backtraces without carrying full variable/type
# debug data through the game and engine dependency graph.
debug = "line-tables-only"
incremental = true

[profile.release]
lto = "thin"

[workspace.dependencies]
glam = "0.32.1"
