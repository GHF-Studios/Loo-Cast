schema = 1

[workspace]
name = "loo-cast"
organization = "ghf-studios"
version = "0.5.0"
repository = "https://github.com/GHF-Studios/Loo-Cast"

[workspace.runtime]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnullvm",
]

[[workspace.projects]]
path = "loo-cast-packagepack"

[[workspace.projects]]
path = "loo-cast-game"

[[workspace.projects]]
path = "spacetime-engine"

[toolchain]
channel = "stable"
version = "1.97.0"
date = "2026-07-09"

[[project]]
name = "loo-cast"
path = "."

[[run]]
name = "default"
project = "loo-cast"
package = "spacetime-engine"
binary = "spacetime-engine"
telemetry = true

[[run]]
name = "profiling"
extends = "default"
profile = "profiling"
features = ["profiling-tracy"]

[[run]]
name = "profiling-memory"
extends = "profiling"
features = ["profiling-tracy-memory"]

[[run]]
name = "full-debug"
extends = "default"
profile = "full-debug"
